services:
  backend:
    # Cold starts can include DB index checks and transformer warmup. The base
    # compose healthcheck is retained, but Smart RAG gives it a realistic grace
    # period so nginx does not fail the whole stack during a legitimate startup.
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    environment:
      SMART_RAG_ENABLED: ${SMART_RAG_ENABLED:-1}
      SMART_RAG_AUTO_SCHEMA: ${SMART_RAG_AUTO_SCHEMA:-1}
      SMART_RAG_BUILD_INDEXES: ${SMART_RAG_BUILD_INDEXES:-1}
      SMART_RAG_QUERY_VARIANTS: ${SMART_RAG_QUERY_VARIANTS:-3}
      SMART_RAG_VECTOR_K: ${SMART_RAG_VECTOR_K:-90}
      SMART_RAG_FTS_K: ${SMART_RAG_FTS_K:-90}
      SMART_RAG_SCOPED_K: ${SMART_RAG_SCOPED_K:-70}
      SMART_RAG_PROCEDURE_CARD_K: ${SMART_RAG_PROCEDURE_CARD_K:-12}
      SMART_RAG_ROUTED_DOCUMENTS: ${SMART_RAG_ROUTED_DOCUMENTS:-8}
      SMART_RAG_RULE_K: ${SMART_RAG_RULE_K:-80}
      SMART_RAG_MAX_CANDIDATES: ${SMART_RAG_MAX_CANDIDATES:-180}
      SMART_RAG_CORPUS_FALLBACK_K: ${SMART_RAG_CORPUS_FALLBACK_K:-160}
      SMART_RAG_FINAL_CONTEXT_CHUNKS: ${SMART_RAG_FINAL_CONTEXT_CHUNKS:-48}
      SMART_RAG_NEIGHBOR_SEEDS: ${SMART_RAG_NEIGHBOR_SEEDS:-60}
      SMART_RAG_NEIGHBOR_WINDOW: ${SMART_RAG_NEIGHBOR_WINDOW:-1}
      SMART_RAG_PRIMARY_CHUNKS_PER_DOCUMENT: ${SMART_RAG_PRIMARY_CHUNKS_PER_DOCUMENT:-64}
      SMART_RAG_REFERENCE_DOCUMENTS: ${SMART_RAG_REFERENCE_DOCUMENTS:-4}
      SMART_RAG_REFERENCE_CHUNKS_PER_DOCUMENT: ${SMART_RAG_REFERENCE_CHUNKS_PER_DOCUMENT:-48}
      SMART_RAG_ALLOW_BROAD_FALLBACK: ${SMART_RAG_ALLOW_BROAD_FALLBACK:-1}
      SMART_RAG_BROAD_FALLBACK_SCORE: ${SMART_RAG_BROAD_FALLBACK_SCORE:-0.12}
      SMART_RAG_LEGACY_FALLBACK_LIMIT: ${SMART_RAG_LEGACY_FALLBACK_LIMIT:-160}

      # Evidence-shape retrieval: bounded semantic lookup inside likely documents,
      # followed by local row/header bridging. Applies to amounts, speeds, limits,
      # pressure, voltage, time, counts and other measurable values.
      SMART_RAG_STRUCTURED_VALUE_K: ${SMART_RAG_STRUCTURED_VALUE_K:-96}
      SMART_RAG_STRUCTURED_VALUE_CONTEXT_CHUNKS: ${SMART_RAG_STRUCTURED_VALUE_CONTEXT_CHUNKS:-12}

      # Explicit amendment/replacement authority context. The derived index stores
      # source directives, but final answers still cite original PDF chunks.
      SMART_RAG_CURRENT_AUTHORITY_CONTEXT_CHUNKS: ${SMART_RAG_CURRENT_AUTHORITY_CONTEXT_CHUNKS:-16}

      # Previous hotfix knobs retained for compatibility; current authority logic
      # no longer relies on a fixed local window as its primary precedence rule.
      SMART_RAG_PRIORITY_FTS_K: ${SMART_RAG_PRIORITY_FTS_K:-80}
      SMART_RAG_AMOUNT_TABLE_K: ${SMART_RAG_AMOUNT_TABLE_K:-80}
      SMART_RAG_AMENDMENT_WINDOW_CHUNKS: ${SMART_RAG_AMENDMENT_WINDOW_CHUNKS:-12}
      SMART_RAG_CURRENT_AMENDMENT_CONTEXT_CHUNKS: ${SMART_RAG_CURRENT_AMENDMENT_CONTEXT_CHUNKS:-12}
