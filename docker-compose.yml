services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdfrag}
      POSTGRES_USER: ${POSTGRES_USER:-pdfrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfrag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfrag} -d ${POSTGRES_DB:-pdfrag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        PRELOAD_EMBEDDING_MODEL: ${PRELOAD_EMBEDDING_MODEL:-0}
        REQUIRE_EMBEDDING_PRELOAD: ${REQUIRE_EMBEDDING_PRELOAD:-0}
        ALLOW_INSECURE_HF_DOWNLOAD: ${ALLOW_INSECURE_HF_DOWNLOAD:-0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdfrag}:${POSTGRES_PASSWORD:-pdfrag}@postgres:5432/${POSTGRES_DB:-pdfrag}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-sol}
      QUERY_MODEL: ${QUERY_MODEL:-gpt-5.6-terra}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-5.6-terra}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-high}
      QUERY_REASONING_EFFORT: ${QUERY_REASONING_EFFORT:-low}
      SUMMARY_REASONING_EFFORT: ${SUMMARY_REASONING_EFFORT:-medium}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-6000}
      SUMMARY_MAX_OUTPUT_TOKENS: ${SUMMARY_MAX_OUTPUT_TOKENS:-5000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-0}
      EMBEDDING_DOWNLOAD_ENABLED: ${EMBEDDING_DOWNLOAD_ENABLED:-0}
      EMBEDDING_FALLBACK_MODE: ${EMBEDDING_FALLBACK_MODE:-hashing}
      REQUIRE_EMBEDDING_AT_STARTUP: ${REQUIRE_EMBEDDING_AT_STARTUP:-0}
      ALLOW_INSECURE_HF_DOWNLOAD: ${ALLOW_INSECURE_HF_DOWNLOAD:-0}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      TOP_K: ${TOP_K:-12}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.05}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-1}
      QUERY_REWRITE_MAX_VARIANTS: ${QUERY_REWRITE_MAX_VARIANTS:-6}
      RETRIEVAL_CHUNKS_PER_DOCUMENT: ${RETRIEVAL_CHUNKS_PER_DOCUMENT:-6}
      MAX_RETRIEVAL_CANDIDATES: ${MAX_RETRIEVAL_CANDIDATES:-3000}
      CORPUS_SCAN_MAX_CHUNKS: ${CORPUS_SCAN_MAX_CHUNKS:-10000}
      ANSWER_EVIDENCE_CHUNK_LIMIT: ${ANSWER_EVIDENCE_CHUNK_LIMIT:-1200}
      REFERENCE_EVIDENCE_CHUNK_LIMIT: ${REFERENCE_EVIDENCE_CHUNK_LIMIT:-5000}
      NEIGHBOR_SEED_LIMIT: ${NEIGHBOR_SEED_LIMIT:-300}
      NEIGHBOR_WINDOW: ${NEIGHBOR_WINDOW:-1}
      REFERENCE_HOP_ENABLED: ${REFERENCE_HOP_ENABLED:-1}
      REFERENCE_HOP_MAX_DOCUMENTS: ${REFERENCE_HOP_MAX_DOCUMENTS:-6}
      REFERENCE_HOP_CHUNKS_PER_DOCUMENT: ${REFERENCE_HOP_CHUNKS_PER_DOCUMENT:-400}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-300000}
      SUMMARY_BATCH_CHARS: ${SUMMARY_BATCH_CHARS:-120000}
      EVIDENCE_TOP_K: ${EVIDENCE_TOP_K:-48}
      CHAT_CONTEXT_MESSAGES: ${CHAT_CONTEXT_MESSAGES:-10}
      CHAT_CONTEXT_CHARS: ${CHAT_CONTEXT_CHARS:-9000}
      CHAT_CONTEXT_PER_MESSAGE_CHARS: ${CHAT_CONTEXT_PER_MESSAGE_CHARS:-1600}
      ABBREVIATION_SCAN_TERMS: ${ABBREVIATION_SCAN_TERMS:-8}
      ABBREVIATION_SCAN_CHUNKS_PER_TERM: ${ABBREVIATION_SCAN_CHUNKS_PER_TERM:-12}
      OCR_MODE: ${OCR_MODE:-auto}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_MIN_NATIVE_CHARS: ${OCR_MIN_NATIVE_CHARS:-80}
      OCR_MIN_TEXT_QUALITY: ${OCR_MIN_TEXT_QUALITY:-0.62}
      OCR_MIN_NATIVE_CONSENSUS: ${OCR_MIN_NATIVE_CONSENSUS:-0.42}
      OCR_ROTATED_TEXT_THRESHOLD: ${OCR_ROTATED_TEXT_THRESHOLD:-0.08}
      OCR_CORRUPTION_THRESHOLD: ${OCR_CORRUPTION_THRESHOLD:-0.12}
      OCR_VERIFY_ALL_PAGES: ${OCR_VERIFY_ALL_PAGES:-0}
      OCR_VERIFY_DPI: ${OCR_VERIFY_DPI:-180}
      OCR_VERIFY_MIN_NOVEL_TERMS: ${OCR_VERIFY_MIN_NOVEL_TERMS:-10}
      OCR_VERIFY_NOVELTY_THRESHOLD: ${OCR_VERIFY_NOVELTY_THRESHOLD:-0.20}
      OCR_PRIMARY_PSM: ${OCR_PRIMARY_PSM:-3}
      OCR_FALLBACK_PSM: ${OCR_FALLBACK_PSM:-6}
      EXTRACT_TABLES: ${EXTRACT_TABLES:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:8081}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/models:ro
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    expose: ["80"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports: ["8081:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
